name: Publish BOLOLO Smart Control HACS release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bololo-smart-control-release
  cancel-in-progress: false

jobs:
  validation:
    name: Validate release
    uses: ./.github/workflows/validate.yml

  release:
    name: Publish HACS ZIP
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve immutable version tag
        id: version
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('custom_components/bololo/manifest.json', 'utf8')).version;
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:b(0|[1-9]\d*))?$/.test(version)) {
              throw new Error(`Invalid release version: ${version}`);
            }
            const tag = `v${version}`;
            const optional = request => request.catch(error => error.status === 404 ? null : Promise.reject(error));
            if (context.ref.startsWith('refs/tags/') && context.ref !== `refs/tags/${tag}`) {
              throw new Error(`Pushed tag ${context.ref} does not match manifest ${version}`);
            }
            if (!fs.existsSync(`docs/releases/${version}.md`)) {
              throw new Error(`Missing release notes for ${version}`);
            }
            let ref = await optional(github.rest.git.getRef({...context.repo, ref: `tags/${tag}`}));
            const release = await optional(github.rest.repos.getReleaseByTag({...context.repo, tag}));
            if (!ref) {
              if (release) throw new Error(`Release ${tag} exists without its tag; refusing to retag it`);
              ref = await github.rest.git.createRef({...context.repo, ref: `refs/tags/${tag}`, sha: context.sha});
            }
            let target = ref.data.object;
            while (target.type === 'tag') {
              target = (await github.rest.git.getTag({...context.repo, tag_sha: target.sha})).data.object;
            }
            if (target.type !== 'commit') throw new Error(`${tag} must identify a commit`);
            const current = target.sha === context.sha;
            core.setOutput('publish', current ? 'true' : 'false');
            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('sha', target.sha);
            if (!current) core.notice(`${tag} already identifies ${target.sha}; increase the manifest version to publish newer code`);

      - uses: actions/setup-python@v5
        if: steps.version.outputs.publish == 'true'
        with:
          python-version: '3.12'
      - name: Build packages from the validated tagged commit
        if: steps.version.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: python tools/build_release.py --expected-version "$RELEASE_VERSION"

      - name: Publish verified assets without replacing existing packages
        if: steps.version.outputs.publish == 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.version.outputs.sha }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const tag = process.env.RELEASE_TAG;
            const version = process.env.RELEASE_VERSION;
            const sha = process.env.RELEASE_SHA;
            let target = (await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`})).data.object;
            while (target.type === 'tag') {
              target = (await github.rest.git.getTag({...context.repo, tag_sha: target.sha})).data.object;
            }
            if (target.type !== 'commit' || target.sha !== sha || sha !== context.sha) {
              throw new Error(`Tag ${tag} changed; refusing to publish mismatched code`);
            }
            const body = fs.readFileSync(`docs/releases/${version}.md`, 'utf8');
            let release = await github.rest.repos.getReleaseByTag({...context.repo, tag}).catch(error => error.status === 404 ? null : Promise.reject(error));
            if (!release) {
              release = await github.rest.repos.createRelease({...context.repo, tag_name: tag, target_commitish: sha, name: tag, body, draft: true, prerelease: false});
            }
            for (const name of ['bololo-smart-control.zip', `bololo-${version}.zip`]) {
              const data = fs.readFileSync(`dist/${name}`);
              const digest = `sha256:${crypto.createHash('sha256').update(data).digest('hex')}`;
              const asset = release.data.assets.find(item => item.name === name);
              if (asset) {
                const downloaded = await github.rest.repos.getReleaseAsset({...context.repo, asset_id: asset.id, headers: {accept: 'application/octet-stream'}});
                const existing = `sha256:${crypto.createHash('sha256').update(Buffer.from(downloaded.data)).digest('hex')}`;
                if (asset.state !== 'uploaded' || existing !== digest) {
                  throw new Error(`Existing asset ${name} differs; publish a new version instead of overwriting it`);
                }
              } else {
                await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.data.id, name, data, headers: {'content-type': 'application/zip', 'content-length': data.length}});
              }
            }
            if (release.data.draft) {
              // bN versions also remain normal releases so HACS can offer updates.
              await github.rest.repos.updateRelease({...context.repo, release_id: release.data.id, draft: false, prerelease: false, make_latest: 'true'});
            }
            core.notice(`Release ${tag} is ready`);
